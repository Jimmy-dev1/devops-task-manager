version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task_manager_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ojima@215
      POSTGRES_DB: task_manager_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: task_manager_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DB_USER=postgres
      - DB_PASSWORD=Ojima@215
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=task_manager_db
      - JWT_SECRET=my_super_secret_dev_key_123
      - JWT_EXPIRES_IN=1h
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: task_manager_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: