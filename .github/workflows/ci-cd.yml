name: CI/CD Pipeline to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          # Install Docker and Docker Compose on EC2 if not present
          if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
              sudo usermod -aG docker $USER
          fi

          # Clone repository or pull latest updates
          if [ -d "/home/${{ secrets.AWS_USER }}/devops-task-manager" ]; then
              cd /home/${{ secrets.AWS_USER }}/devops-task-manager
              git pull origin main
          else
              git clone https://github.com/Jimmy-dev1/devops-task-manager.git /home/${{ secrets.AWS_USER }}/devops-task-manager
              cd /home/${{ secrets.AWS_USER }}/devops-task-manager
          fi

          # Bring down old containers and build/start new ones with Nginx proxy
          sudo docker compose down
          sudo docker compose up -d --build