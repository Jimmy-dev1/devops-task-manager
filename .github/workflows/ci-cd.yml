name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USER: taskmanager_app
      DB_HOST: localhost
      DB_NAME: taskmanager
      DB_PASSWORD: ci-only-app-database-password
      DB_PORT: 5432
      DB_ADMIN_USER: postgres
      DB_ADMIN_PASSWORD: ci-only-database-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      APP_ORIGIN: http://localhost:5173
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify migrations against the previous schema
        working-directory: backend
        run: |
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql --host localhost --username "$DB_ADMIN_USER" --dbname "$DB_NAME" <<'SQL'
          CREATE TABLE users (
            id SERIAL PRIMARY KEY,
            email VARCHAR(255) UNIQUE NOT NULL,
            password_hash VARCHAR(255) NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          CREATE TABLE tasks (
            id SERIAL PRIMARY KEY,
            user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
            title VARCHAR(255) NOT NULL,
            description TEXT,
            status VARCHAR(50) DEFAULT 'pending',
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO users (email, password_hash) VALUES ('migration@example.com', 'test-hash');
          INSERT INTO tasks (user_id, title, status)
          VALUES (1, 'Existing task', 'in-progress');
          SQL
          npm run init-db
          npm run init-db
          status="$(PGPASSWORD="$DB_ADMIN_PASSWORD" psql --host localhost --username "$DB_ADMIN_USER" --dbname "$DB_NAME" --tuples-only --no-align --command "SELECT status FROM tasks WHERE title = 'Existing task'")"
          test "$status" = "pending"
          superuser="$(PGPASSWORD="$DB_ADMIN_PASSWORD" psql --host localhost --username "$DB_ADMIN_USER" --dbname "$DB_NAME" --tuples-only --no-align --command "SELECT rolsuper FROM pg_roles WHERE rolname = 'taskmanager_app'")"
          test "$superuser" = "f"

      - name: Verify restricted application database access
        working-directory: backend
        run: |
          node -e 'const db = require("./src/config/db"); db.query("SELECT status FROM tasks WHERE title = $1", ["Existing task"]).then(({ rows }) => { if (rows[0]?.status !== "pending") process.exitCode = 1; }).catch((error) => { console.error(error); process.exitCode = 1; }).finally(() => db.end());'

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend container
        run: docker build --tag devops-task-manager-backend:ci ./backend

      - name: Build frontend container
        run: docker build --tag devops-task-manager-frontend:ci ./frontend

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-SSM-Deploy

      - name: Deploy through Systems Manager
        env:
          AWS_REGION: us-east-1
          EC2_INSTANCE_ID: i-0231f9918238b10f3
        run: |
          set -euo pipefail

          aws --version
          jq --version

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          #!/bin/bash
          set -eu

          sudo -u ubuntu -H bash -s <<'DEPLOY'
          set -eu
          repo_dir="$HOME/devops-task-manager"

          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose-v2
          fi

          if [ -d "$repo_dir/.git" ]; then
            cd "$repo_dir"
            git pull --ff-only origin main
          elif [ ! -e "$repo_dir" ]; then
            git clone https://github.com/Jimmy-dev1/devops-task-manager.git "$repo_dir"
            cd "$repo_dir"
          else
            echo "Deployment path exists but is not a Git checkout: $repo_dir" >&2
            exit 1
          fi

          sudo docker compose up -d --build --remove-orphans
          sudo docker compose rm --force migrator
          DEPLOY
          SCRIPT
          )

          REQUEST_FILE="$RUNNER_TEMP/ssm-command.json"
          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg command "$DEPLOY_SCRIPT" \
            '{DocumentName:"AWS-RunShellScript",InstanceIds:[$instance],Parameters:{commands:[$command],executionTimeout:["1800"]},Comment:"Deploy devops-task-manager"}' \
            > "$REQUEST_FILE"

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json "file://$REQUEST_FILE" \
            --query 'Command.CommandId' \
            --output text)
          echo "Started SSM deployment command: $COMMAND_ID"

          for attempt in $(seq 1 190); do
            ERROR_FILE="$RUNNER_TEMP/ssm-invocation-error"
            if ! INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>"$ERROR_FILE"); then
              if grep -q 'InvocationDoesNotExist' "$ERROR_FILE"; then
                sleep 10
                continue
              fi
              cat "$ERROR_FILE" >&2
              exit 1
            fi

            STATUS=$(jq -r '.Status' <<< "$INVOCATION")
            case "$STATUS" in
              Success)
                echo "SSM deployment completed successfully."
                jq -r '.StandardOutputContent // empty' <<< "$INVOCATION"
                exit 0
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                echo "SSM deployment failed with status: $STATUS" >&2
                jq -r '(.StandardOutputContent // empty), (.StandardErrorContent // empty)' <<< "$INVOCATION" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for the SSM deployment command to finish." >&2
          exit 1
